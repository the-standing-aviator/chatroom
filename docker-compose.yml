# communicate 全栈编排：gateway + 依赖(PG/Redis/NATS) + 监控(Prometheus/Alertmanager/Grafana)
# 一键起整套：
#   docker compose up -d --build
# 停止（保留数据卷）：
#   docker compose down
# 停止并清空数据卷：
#   docker compose down -v
#
# 对外只暴露：gateway 8888(TCP) / 8890(WS+前端) + 监控 UI(9090/9093/3000)
# PG / Redis / NATS 仅内部网络互通，不对外暴露（生产同理）。
# 凭据 chat/chat 与 jwt-secret 仅本地开发，生产务必改（见 deploy/README.md）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: communicate-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # 本地要 psql 调试时，临时取消注释：
    # ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    container_name: communicate-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: communicate-nats
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: communicate-gateway:local
    container_name: communicate-gateway
    command:
      - -addr
      - :8888
      - -ws-addr
      - :8890
      - -metrics
      - :9100
      - -store
      - postgres
      - -presence
      - redis
      - -redis-addr
      - redis:6379
      - -bus
      - nats
      - -nats-url
      - nats://nats:4222
    environment:
      # 密钥走环境变量（对应裸机 systemd 的 EnvironmentFile 思路，不进 command 防泄露）
      COMMUNICATE_DSN: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      COMMUNICATE_JWT_SECRET: dev-secret-change-me
    volumes:
      # 上传的文件必须落在具名卷上：否则 docker compose down/up 或 --build 重建容器时，
      # 字节随容器可写层一起消失，而 PG 里 files 表元数据还在 —— 下载会 404，属于静默丢数据。
      # 镜像里 WORKDIR 是 /data，-file-dir 默认 ./files 即 /data/files。
      - gateway_files:/data
    ports:
      - "8888:8888"   # TCP 客户端
      - "8890:8890"   # WebSocket 升级 + 浏览器前端（http://localhost:8890）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: communicate-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'   # 本地只留 15 天，长存交给后续远程存储
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: communicate-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: communicate-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin          # TODO 上线前必改
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  gateway_files:   # 上传文件字节（元数据在 PG 的 files 表，字节在这里）
