<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>communicate 聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #4f8cff;
    --ok: #37d67a;
    --err: #ff5c5c;
    --sys: #8a93a6;
    --private: #f0c15a;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
  }
  #app { width: min(1000px, 100vw); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; font-weight: 600; }
  #header-right { display: flex; align-items: center; gap: 10px; }
  #conn-status { font-size: 13px; color: var(--muted); }
  #conn-status.ok { color: var(--ok); }
  #conn-status.err { color: var(--err); }
  #rename-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer; }
  #rename-btn:hover { border-color: var(--accent); color: var(--accent); }
  #rename-btn.hidden { display: none; }
  #rename-box { display: flex; align-items: center; gap: 6px; }
  #rename-box.hidden { display: none; }
  #rename-box input { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; width: 140px; outline: none; }
  #rename-box input:focus { border-color: var(--accent); }
  #rename-box button { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer; }
  #rename-box button:hover { border-color: var(--accent); }
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 200px; border-right: 1px solid var(--border); padding: 14px; overflow-y: auto; }
  #sidebar h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  #user-list { list-style: none; }
  #user-list li { padding: 5px 8px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  #user-list li:hover { background: var(--border); }
  #user-list li.active { color: var(--private); font-weight: 600; }
  #user-list li.me { color: var(--accent); cursor: default; }
  #user-list li.me:hover { background: transparent; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .line { margin-bottom: 6px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .line .time { color: var(--muted); font-size: 12px; margin-right: 8px; }
  .line .who { font-weight: 600; color: var(--accent); }
  .line.system .body { color: var(--sys); }
  .line.error .body { color: var(--err); }
  .line.private .body { color: var(--private); }
  .line.file .file-link { color: var(--accent); text-decoration: none; }
  .line.file .file-link:hover { text-decoration: underline; }
  #composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
  #input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #file-btn { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer; }
  #file-btn:disabled { opacity: .5; cursor: not-allowed; }
  #file-btn:hover:not(:disabled) { border-color: var(--accent); }
  #mode-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--panel); font-size: 13px; color: var(--private); }
  #mode-bar.hidden { display: none; }
  #mode-bar button { padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--muted); font-size: 12px; cursor: pointer; }
  #mode-bar button:hover { color: var(--text); border-color: var(--muted); }
  #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; }
  #login-overlay.hidden { display: none; }
  #login-form { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
  #login-form h2 { font-size: 18px; text-align: center; margin-bottom: 4px; }
  #login-form input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  #login-form input:focus { border-color: var(--accent); }
  #login-form button { padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  #login-msg { font-size: 13px; color: var(--err); min-height: 18px; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>communicate 聊天室</h1>
      <div id="header-right">
        <span id="conn-status">连接中…</span>
        <button id="rename-btn" type="button" class="hidden">改名</button>
        <span id="rename-box" class="hidden">
          <input id="rename-input" maxlength="32" placeholder="新昵称">
          <button id="rename-ok" type="button">确定</button>
          <button id="rename-cancel" type="button">取消</button>
        </span>
      </div>
    </header>
    <div id="main">
      <aside id="sidebar">
        <h2>在线 <span id="online-count">0</span></h2>
        <ul id="user-list"></ul>
      </aside>
      <section id="chat">
        <div id="log"></div>
        <div id="mode-bar" class="hidden">
          <span id="mode-label"></span>
          <button id="mode-exit" type="button">返回公聊</button>
        </div>
        <form id="composer">
          <input id="input" autocomplete="off" placeholder="说点什么…" disabled>
          <button id="send" disabled>发送</button>
          <button id="file-btn" type="button" disabled title="发送文件">📎</button>
          <input id="file-input" type="file" hidden>
        </form>
      </section>
    </div>
  </div>

  <div id="login-overlay">
    <form id="login-form">
      <h2>进入聊天室</h2>
      <input id="login-name" placeholder="昵称" autocomplete="off" maxlength="32">
      <input id="login-pass" type="password" placeholder="密码">
      <button type="submit">登录 / 注册</button>
      <div id="login-msg"></div>
      <p class="hint">昵称不存在会自动注册</p>
    </form>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  const input = $('input');
  const sendBtn = $('send');
  const composer = $('composer');
  const userList = $('user-list');
  const onlineCount = $('online-count');
  const statusEl = $('conn-status');
  const overlay = $('login-overlay');
  const loginForm = $('login-form');
  const loginName = $('login-name');
  const loginPass = $('login-pass');
  const loginMsg = $('login-msg');
  const modeBar = $('mode-bar');
  const modeLabel = $('mode-label');
  const modeExit = $('mode-exit');
  const renameBtn = $('rename-btn');
  const renameBox = $('rename-box');
  const renameInput = $('rename-input');
  const renameOk = $('rename-ok');
  const renameCancel = $('rename-cancel');
  const fileBtn = $('file-btn');
  const fileInput = $('file-input');

  let ws = null;
  let privateTo = null;
  let onlineUsers = [];
  let renameOld = null; // 非 null = 改名乐观更新中，值为旧名（失败时回退）
  let myName = localStorage.getItem('communicate_name') || '';
  let pendingAuth = null; // 'token' | 'password'：正在鉴权中
  let heartbeat = null;
  let whoTimer = null;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws');

    ws.onopen = () => {
      setStatus('已连接', 'ok');
      startHeartbeat();
      const token = localStorage.getItem('communicate_token');
      if (token) {
        pendingAuth = 'token';
        ws.send(JSON.stringify({ type: 'auth_token', token: token }));
      } else {
        pendingAuth = 'password';
        showLogin();
      }
    };

    ws.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      handle(m);
    };

    ws.onclose = () => {
      setStatus('已断开，重连中…', 'err');
      stopHeartbeat();
      stopWhoTimer();
      setPrivateMode(null);
      enableComposer(false);
      showLogin('连接断开，请重新登录');
      setTimeout(connect, 2000);
    };

    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  function handle(m) {
    switch (m.type) {
      case 'system':
        if (renameOld !== null && m.content.startsWith('已更新昵称为')) {
          renameOld = null; // 改名成功，确认新名
          if (m.token) localStorage.setItem('communicate_token', m.token); // 改名重签 token，重连后仍是新名
        } else if (m.token) {
          localStorage.setItem('communicate_token', m.token);
          localStorage.setItem('communicate_name', myName);
          pendingAuth = null;
          hideLogin();
          enableComposer(true);
          requestWho();
          requestHistory();
          startWhoTimer();
        }
        addLine('system', m.content, '', m.ts, '');
        break;
      case 'broadcast':
        addLine('chat', m.content, m.from, m.ts, '');
        break;
      case 'private':
        addLine('private', m.content, m.from, m.ts, m.to);
        break;
      case 'error':
        if (pendingAuth) {
          if (pendingAuth === 'token') localStorage.removeItem('communicate_token');
          pendingAuth = null;
          loginMsg.textContent = m.error;
          showLogin();
        } else if (renameOld !== null) {
          // 改名失败（昵称被占用等）：回退到旧名，刷新列表纠正「我」的高亮。
          myName = renameOld;
          renameOld = null;
          localStorage.setItem('communicate_name', myName);
          requestWho();
          addLine('error', m.error, '', m.ts, '');
        } else {
          addLine('error', m.error, '', m.ts, '');
        }
        break;
      case 'who_list':
        renderUsers(m.users || []);
        break;
      case 'history':
        renderHistory(m.messages || []);
        break;
      case 'file':
        addFileLine(m.from, m.file_name, m.file_size, m.file_id, m.ts);
        break;
      case 'pong':
        break;
      default:
        break;
    }
  }

  function addLine(kind, text, from, ts, to) {
    const line = document.createElement('div');
    line.className = 'line ' + kind;

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = fmtTime(ts);
    line.appendChild(time);

    if (kind === 'chat') {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = from + ': ';
      line.appendChild(who);
    } else if (kind === 'private') {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = '🔒 ' + from + ' → ' + to + ': ';
      line.appendChild(who);
    }

    const body = document.createElement('span');
    body.className = 'body';
    body.textContent = text; // textContent 防 XSS：用户内容绝不进 innerHTML
    line.appendChild(body);

    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function addFileLine(from, fileName, fileSize, fileID, ts) {
    const line = document.createElement('div');
    line.className = 'line file';

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = fmtTime(ts);
    line.appendChild(time);

    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = from + ': ';
    line.appendChild(who);

    // 用 DOM API 建链接（href/textContent 都是安全赋值，不走 innerHTML，防 XSS），
    // href 指向 /download/{id}，download 属性建议浏览器用原文件名保存。
    const link = document.createElement('a');
    link.className = 'file-link';
    link.href = '/download/' + fileID;
    link.download = fileName;
    link.textContent = '📄 ' + fileName + ' (' + fmtSize(fileSize) + ')';
    line.appendChild(link);

    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function fmtTime(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function renderUsers(users) {
    onlineUsers = users;
    userList.textContent = '';
    onlineCount.textContent = users.length;
    const sorted = users.slice().sort((a, b) => a.localeCompare(b));
    for (const u of sorted) {
      const li = document.createElement('li');
      li.textContent = u;
      if (u === myName) {
        li.className = 'me';
      } else {
        li.title = '点击私聊 ' + u;
        li.addEventListener('click', () => togglePrivate(u));
        if (u === privateTo) li.className = 'active';
      }
      userList.appendChild(li);
    }
  }

  function togglePrivate(u) {
    // 再点同一个 = 退出私聊；否则进入与 u 的私聊。
    setPrivateMode(privateTo === u ? null : u);
  }
  function setPrivateMode(to) {
    privateTo = to;
    if (to) {
      modeLabel.textContent = '🔒 私聊 ' + to;
      modeBar.classList.remove('hidden');
      input.placeholder = '私聊 ' + to + '…';
    } else {
      modeLabel.textContent = '';
      modeBar.classList.add('hidden');
      input.placeholder = '说点什么…';
    }
    renderUsers(onlineUsers); // 刷新高亮：当前私聊对象高亮
  }
  modeExit.onclick = () => setPrivateMode(null);

  function showRenameBox() {
    renameBtn.classList.add('hidden');
    renameBox.classList.remove('hidden');
    renameInput.value = '';
    renameInput.focus();
  }
  function hideRenameBox() {
    renameBox.classList.add('hidden');
    renameBtn.classList.remove('hidden');
  }
  function submitRename(newName) {
    renameOld = myName; // 乐观更新前记住旧名，失败时回退
    myName = newName;
    localStorage.setItem('communicate_name', myName);
    ws.send(JSON.stringify({ type: 'rename', new_name: newName }));
    requestWho(); // 刷新列表，让「我」高亮指向新名
    hideRenameBox();
  }
  renameBtn.onclick = showRenameBox;
  renameCancel.onclick = hideRenameBox;
  renameOk.onclick = () => {
    const n = renameInput.value.trim();
    if (!n) { renameInput.focus(); return; }
    submitRename(n);
  };
  renameInput.onkeydown = (e) => { if (e.key === 'Enter') renameOk.onclick(); };

  function requestWho() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'who' }));
  }
  function requestHistory() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'history', limit: 50 }));
  }
  function renderHistory(messages) {
    // 后端按时间从旧到新返回；登录后一次性补上，让新来的看到刚才聊了什么。
    for (const msg of messages) {
      if (msg.type === 'chat') addLine('chat', msg.content, msg.from, msg.ts, '');
      else if (msg.type === 'private') addLine('private', msg.content, msg.from, msg.ts, msg.to);
      else if (msg.type === 'file') addFileLine(msg.from, msg.file_name, msg.file_size, msg.file_id, msg.ts);
    }
  }
  function startWhoTimer() { stopWhoTimer(); whoTimer = setInterval(requestWho, 30000); }
  function stopWhoTimer() { if (whoTimer) { clearInterval(whoTimer); whoTimer = null; } }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeat = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'heartbeat' }));
    }, 20000);
  }
  function stopHeartbeat() { if (heartbeat) { clearInterval(heartbeat); heartbeat = null; } }

  function enableComposer(on) {
    input.disabled = !on;
    sendBtn.disabled = !on;
    fileBtn.disabled = !on;
    renameBtn.classList.toggle('hidden', !on);
    if (!on) renameBox.classList.add('hidden');
    if (on) input.focus();
  }
  function showLogin(msg) {
    overlay.classList.remove('hidden');
    if (msg) loginMsg.textContent = msg;
    enableComposer(false);
  }
  function hideLogin() {
    overlay.classList.add('hidden');
    loginMsg.textContent = '';
  }

  loginForm.onsubmit = (e) => {
    e.preventDefault();
    const name = loginName.value.trim();
    const pass = loginPass.value;
    if (!name || !pass) { loginMsg.textContent = '昵称和密码不能为空'; return; }
    myName = name;
    pendingAuth = 'password';
    loginMsg.textContent = '登录中…';
    ws.send(JSON.stringify({ type: 'auth', name: name, password: pass }));
    loginPass.value = '';
  };

  composer.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (privateTo) {
      ws.send(JSON.stringify({ type: 'private', to: privateTo, content: text }));
      // 后端只把私聊投递给对方、不回显给发送者（不像 chat 广播会回给自己），
      // 所以这里本地回显，否则发送者会以为消息没发出去。
      addLine('private', text, myName, Math.floor(Date.now() / 1000), privateTo);
    } else {
      ws.send(JSON.stringify({ type: 'chat', content: text }));
    }
    input.value = '';
    input.focus();
  };

  // 文件上传：先 POST /upload（带 JWT）存字节，拿到 file_id 后再发 WS 的 file 消息广播元数据。
  // 两步与后端一致（HTTP 走字节、WS 走聊天）；广播会回显给所有在线用户（含自己），无需本地回显。
  fileBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    if (fileInput.files && fileInput.files[0]) uploadFile(fileInput.files[0]);
  };
  async function uploadFile(file) {
    const token = localStorage.getItem('communicate_token');
    if (!token || !ws || ws.readyState !== WebSocket.OPEN) {
      addLine('error', '请先登录后再发文件', '', Math.floor(Date.now() / 1000), '');
      return;
    }
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd,
      });
      if (!res.ok) {
        // 服务端对「文件过大」等错误给了明确文案，直接透出来，别让用户只看到状态码。
        const msg = (await res.text()).trim();
        addLine('error', '上传失败（' + res.status + '）' + (msg ? '：' + msg : ''), '', Math.floor(Date.now() / 1000), '');
        return;
      }
      const data = await res.json();
      if (ws.readyState === WebSocket.OPEN) {
        // 私聊模式下带上 to：服务端只投递给对方，不广播给所有人。
        // 不带 to 就是公聊文件，在线所有人都能看到。
        const msg = { type: 'file', file_id: data.file_id, file_name: data.file_name, file_size: data.file_size };
        if (privateTo) {
          msg.to = privateTo;
          ws.send(JSON.stringify(msg));
          // 后端私聊只投递给对方、不回显给发送者（与私聊文本一致），本地补一行。
          addFileLine(myName, data.file_name, data.file_size, data.file_id, Math.floor(Date.now() / 1000));
        } else {
          ws.send(JSON.stringify(msg));
        }
      }
    } catch (e) {
      addLine('error', '上传失败，请重试', '', Math.floor(Date.now() / 1000), '');
    } finally {
      fileInput.value = ''; // 清空，允许下次再选同一个文件
    }
  }

  connect();
</script>
</body>
</html>
