<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>communicate 聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #4f8cff;
    --ok: #37d67a;
    --err: #ff5c5c;
    --sys: #8a93a6;
    --private: #f0c15a;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
  }
  #app { width: min(1000px, 100vw); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; font-weight: 600; }
  #conn-status { font-size: 13px; color: var(--muted); }
  #conn-status.ok { color: var(--ok); }
  #conn-status.err { color: var(--err); }
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 200px; border-right: 1px solid var(--border); padding: 14px; overflow-y: auto; }
  #sidebar h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  #user-list { list-style: none; }
  #user-list li { padding: 5px 8px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  #user-list li:hover { background: var(--border); }
  #user-list li.active { color: var(--private); font-weight: 600; }
  #user-list li.me { color: var(--accent); cursor: default; }
  #user-list li.me:hover { background: transparent; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .line { margin-bottom: 6px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .line .time { color: var(--muted); font-size: 12px; margin-right: 8px; }
  .line .who { font-weight: 600; color: var(--accent); }
  .line.system .body { color: var(--sys); }
  .line.error .body { color: var(--err); }
  .line.private .body { color: var(--private); }
  #composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
  #input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  #mode-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--panel); font-size: 13px; color: var(--private); }
  #mode-bar.hidden { display: none; }
  #mode-bar button { padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--muted); font-size: 12px; cursor: pointer; }
  #mode-bar button:hover { color: var(--text); border-color: var(--muted); }
  #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; }
  #login-overlay.hidden { display: none; }
  #login-form { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
  #login-form h2 { font-size: 18px; text-align: center; margin-bottom: 4px; }
  #login-form input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  #login-form input:focus { border-color: var(--accent); }
  #login-form button { padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  #login-msg { font-size: 13px; color: var(--err); min-height: 18px; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>communicate 聊天室</h1>
      <span id="conn-status">连接中…</span>
    </header>
    <div id="main">
      <aside id="sidebar">
        <h2>在线 <span id="online-count">0</span></h2>
        <ul id="user-list"></ul>
      </aside>
      <section id="chat">
        <div id="log"></div>
        <div id="mode-bar" class="hidden">
          <span id="mode-label"></span>
          <button id="mode-exit" type="button">返回公聊</button>
        </div>
        <form id="composer">
          <input id="input" autocomplete="off" placeholder="说点什么…" disabled>
          <button id="send" disabled>发送</button>
        </form>
      </section>
    </div>
  </div>

  <div id="login-overlay">
    <form id="login-form">
      <h2>进入聊天室</h2>
      <input id="login-name" placeholder="昵称" autocomplete="off" maxlength="32">
      <input id="login-pass" type="password" placeholder="密码">
      <button type="submit">登录 / 注册</button>
      <div id="login-msg"></div>
      <p class="hint">昵称不存在会自动注册</p>
    </form>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  const input = $('input');
  const sendBtn = $('send');
  const composer = $('composer');
  const userList = $('user-list');
  const onlineCount = $('online-count');
  const statusEl = $('conn-status');
  const overlay = $('login-overlay');
  const loginForm = $('login-form');
  const loginName = $('login-name');
  const loginPass = $('login-pass');
  const loginMsg = $('login-msg');
  const modeBar = $('mode-bar');
  const modeLabel = $('mode-label');
  const modeExit = $('mode-exit');

  let ws = null;
  let privateTo = null;
  let onlineUsers = [];
  let myName = localStorage.getItem('communicate_name') || '';
  let pendingAuth = null; // 'token' | 'password'：正在鉴权中
  let heartbeat = null;
  let whoTimer = null;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws');

    ws.onopen = () => {
      setStatus('已连接', 'ok');
      startHeartbeat();
      const token = localStorage.getItem('communicate_token');
      if (token) {
        pendingAuth = 'token';
        ws.send(JSON.stringify({ type: 'auth_token', token: token }));
      } else {
        pendingAuth = 'password';
        showLogin();
      }
    };

    ws.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      handle(m);
    };

    ws.onclose = () => {
      setStatus('已断开，重连中…', 'err');
      stopHeartbeat();
      stopWhoTimer();
      setPrivateMode(null);
      enableComposer(false);
      showLogin('连接断开，请重新登录');
      setTimeout(connect, 2000);
    };

    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  function handle(m) {
    switch (m.type) {
      case 'system':
        if (m.token) {
          localStorage.setItem('communicate_token', m.token);
          localStorage.setItem('communicate_name', myName);
          pendingAuth = null;
          hideLogin();
          enableComposer(true);
          requestWho();
          requestHistory();
          startWhoTimer();
        }
        addLine('system', m.content, '', m.ts, '');
        break;
      case 'broadcast':
        addLine('chat', m.content, m.from, m.ts, '');
        break;
      case 'private':
        addLine('private', m.content, m.from, m.ts, m.to);
        break;
      case 'error':
        if (pendingAuth) {
          if (pendingAuth === 'token') localStorage.removeItem('communicate_token');
          pendingAuth = null;
          loginMsg.textContent = m.error;
          showLogin();
        } else {
          addLine('error', m.error, '', m.ts, '');
        }
        break;
      case 'who_list':
        renderUsers(m.users || []);
        break;
      case 'history':
        renderHistory(m.messages || []);
        break;
      case 'pong':
        break;
      default:
        break;
    }
  }

  function addLine(kind, text, from, ts, to) {
    const line = document.createElement('div');
    line.className = 'line ' + kind;

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = fmtTime(ts);
    line.appendChild(time);

    if (kind === 'chat') {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = from + ': ';
      line.appendChild(who);
    } else if (kind === 'private') {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = '🔒 ' + from + ' → ' + to + ': ';
      line.appendChild(who);
    }

    const body = document.createElement('span');
    body.className = 'body';
    body.textContent = text; // textContent 防 XSS：用户内容绝不进 innerHTML
    line.appendChild(body);

    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function fmtTime(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function renderUsers(users) {
    onlineUsers = users;
    userList.textContent = '';
    onlineCount.textContent = users.length;
    const sorted = users.slice().sort((a, b) => a.localeCompare(b));
    for (const u of sorted) {
      const li = document.createElement('li');
      li.textContent = u;
      if (u === myName) {
        li.className = 'me';
      } else {
        li.title = '点击私聊 ' + u;
        li.addEventListener('click', () => togglePrivate(u));
        if (u === privateTo) li.className = 'active';
      }
      userList.appendChild(li);
    }
  }

  function togglePrivate(u) {
    // 再点同一个 = 退出私聊；否则进入与 u 的私聊。
    setPrivateMode(privateTo === u ? null : u);
  }
  function setPrivateMode(to) {
    privateTo = to;
    if (to) {
      modeLabel.textContent = '🔒 私聊 ' + to;
      modeBar.classList.remove('hidden');
      input.placeholder = '私聊 ' + to + '…';
    } else {
      modeLabel.textContent = '';
      modeBar.classList.add('hidden');
      input.placeholder = '说点什么…';
    }
    renderUsers(onlineUsers); // 刷新高亮：当前私聊对象高亮
  }
  modeExit.onclick = () => setPrivateMode(null);

  function requestWho() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'who' }));
  }
  function requestHistory() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'history', limit: 50 }));
  }
  function renderHistory(messages) {
    // 后端按时间从旧到新返回；登录后一次性补上，让新来的看到刚才聊了什么。
    for (const msg of messages) {
      if (msg.type === 'chat') addLine('chat', msg.content, msg.from, msg.ts, '');
      else if (msg.type === 'private') addLine('private', msg.content, msg.from, msg.ts, msg.to);
    }
  }
  function startWhoTimer() { stopWhoTimer(); whoTimer = setInterval(requestWho, 30000); }
  function stopWhoTimer() { if (whoTimer) { clearInterval(whoTimer); whoTimer = null; } }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeat = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'heartbeat' }));
    }, 20000);
  }
  function stopHeartbeat() { if (heartbeat) { clearInterval(heartbeat); heartbeat = null; } }

  function enableComposer(on) {
    input.disabled = !on;
    sendBtn.disabled = !on;
    if (on) input.focus();
  }
  function showLogin(msg) {
    overlay.classList.remove('hidden');
    if (msg) loginMsg.textContent = msg;
    enableComposer(false);
  }
  function hideLogin() {
    overlay.classList.add('hidden');
    loginMsg.textContent = '';
  }

  loginForm.onsubmit = (e) => {
    e.preventDefault();
    const name = loginName.value.trim();
    const pass = loginPass.value;
    if (!name || !pass) { loginMsg.textContent = '昵称和密码不能为空'; return; }
    myName = name;
    pendingAuth = 'password';
    loginMsg.textContent = '登录中…';
    ws.send(JSON.stringify({ type: 'auth', name: name, password: pass }));
    loginPass.value = '';
  };

  composer.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (privateTo) {
      ws.send(JSON.stringify({ type: 'private', to: privateTo, content: text }));
      // 后端只把私聊投递给对方、不回显给发送者（不像 chat 广播会回给自己），
      // 所以这里本地回显，否则发送者会以为消息没发出去。
      addLine('private', text, myName, Math.floor(Date.now() / 1000), privateTo);
    } else {
      ws.send(JSON.stringify({ type: 'chat', content: text }));
    }
    input.value = '';
    input.focus();
  };

  connect();
</script>
</body>
</html>
