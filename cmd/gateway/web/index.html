<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>communicate 聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0d12;
    --bg-elev: #12151d;
    --panel: #171b24;
    --panel-2: #1e2330;
    --border: #262c3a;
    --border-soft: #1e2330;
    --text: #e8ebf2;
    --muted: #8892a6;
    --muted-2: #5c6579;
    --accent: #5b8cff;
    --accent-soft: rgba(91,140,255,.14);
    --ok: #3ddc84;
    --err: #ff6b6b;
    --private: #f5c451;
    --radius: 12px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2135 0%, var(--bg) 55%);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3142; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #39425a; }
  ::-webkit-scrollbar-track { background: transparent; }
  .hidden { display: none !important; }

  /* ============ 登录 / 注册 ============ */
  #auth-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #auth-card {
    width: 100%; max-width: 400px;
    background: linear-gradient(180deg, rgba(30,35,48,.92), rgba(23,27,36,.96));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset;
    backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #8a5bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 6px 18px rgba(91,140,255,.35);
  }
  .brand-name { font-size: 20px; font-weight: 650; letter-spacing: .2px; }
  .auth-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .tabs { display: flex; background: var(--bg-elev); border: 1px solid var(--border-soft); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; padding: 9px; border: none; border-radius: 7px; background: transparent;
    color: var(--muted); font-size: 14px; font-weight: 550; cursor: pointer;
    transition: background .18s, color .18s;
  }
  .tabs button.active { background: var(--panel-2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .tabs button:hover:not(.active) { color: var(--text); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%; padding: 11px 13px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
    font-size: 14px; outline: none; transition: border-color .18s, box-shadow .18s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field input::placeholder { color: var(--muted-2); }

  .btn-primary {
    width: 100%; padding: 12px; border: none; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7b6bff);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: filter .18s, transform .06s;
    box-shadow: 0 8px 20px rgba(91,140,255,.28);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; filter: none; }

  #auth-msg { font-size: 13px; color: var(--err); min-height: 18px; text-align: center; margin-top: 12px; }
  .auth-hint { font-size: 12px; color: var(--muted-2); text-align: center; margin-top: 14px; line-height: 1.6; }

  /* ============ 主界面 ============ */
  #app { display: flex; height: 100vh; }

  /* 侧栏 */
  #sidebar {
    width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--bg-elev); border-right: 1px solid var(--border-soft);
  }
  #sidebar-head {
    padding: 16px 16px 12px; display: flex; align-items: center; gap: 9px;
    border-bottom: 1px solid var(--border-soft);
  }
  #sidebar-head .brand-logo { width: 28px; height: 28px; font-size: 15px; border-radius: 8px; }
  #sidebar-head .brand-name { font-size: 15px; }
  #conn-status { margin-left: auto; font-size: 11px; color: var(--muted-2); white-space: nowrap; }
  #conn-status.ok { color: var(--ok); }
  #conn-status.err { color: var(--err); }

  #conv-section { padding: 12px 10px 6px; }
  .section-label {
    font-size: 11px; font-weight: 650; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: .8px; padding: 0 6px 8px;
  }
  #conv-list { list-style: none; }
  #conv-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    transition: background .15s; margin-bottom: 2px;
  }
  #conv-list li:hover { background: var(--panel); }
  #conv-list li.active { background: var(--accent-soft); }
  #conv-list li.active .conv-name { color: var(--text); font-weight: 600; }
  .conv-avatar {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 650; color: #fff;
  }
  .conv-avatar.public { background: linear-gradient(135deg, #4a7dff, #6f5bff); }
  .conv-meta { min-width: 0; flex: 1; }
  .conv-name { font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-sub { font-size: 11px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 6px;
    background: var(--private); color: #1a1a1a; font-weight: 700;
  }

  #online-section { flex: 1; overflow-y: auto; padding: 12px 10px 16px; border-top: 1px solid var(--border-soft); margin-top: 6px; }
  #user-list { list-style: none; }
  #user-list li {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    transition: background .15s; font-size: 13.5px;
  }
  #user-list li:hover { background: var(--panel); }
  #user-list li.me { cursor: default; color: var(--accent); }
  #user-list li.me:hover { background: transparent; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .user-avatar {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 650; color: #fff;
  }
  .me-tag { font-size: 10px; color: var(--muted-2); margin-left: auto; }

  /* 聊天区 */
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  #chat-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border-soft);
    background: rgba(18,21,29,.7); backdrop-filter: blur(8px);
  }
  #chat-title { font-size: 15px; font-weight: 620; }
  #chat-sub { font-size: 12px; color: var(--muted-2); margin-left: 2px; }
  #chat-head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  #rename-box { display: flex; align-items: center; gap: 6px; }
  #rename-input {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-elev); color: var(--text); font-size: 13px; width: 130px; outline: none;
  }
  #rename-input:focus { border-color: var(--accent); }
  #rename-box .icon-btn { padding: 7px 10px; }

  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; }

  /* 消息气泡 */
  .msg { display: flex; gap: 9px; margin-bottom: 8px; max-width: 76%; }
  .msg.self { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 650; color: #fff;
    align-self: flex-end;
  }
  .msg-body { min-width: 0; }
  .msg-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px; padding: 0 3px; }
  .msg.self .msg-head { flex-direction: row-reverse; }
  .msg-name { font-size: 12px; font-weight: 600; color: var(--muted); }
  .msg-time { font-size: 10.5px; color: var(--muted-2); }
  .bubble {
    padding: 9px 13px; border-radius: 13px; font-size: 14px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
    background: var(--panel-2); color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.self .bubble {
    background: linear-gradient(135deg, var(--accent), #6f7bff);
    color: #fff; border-bottom-left-radius: 13px; border-bottom-right-radius: 4px;
  }
  .msg.file .bubble { padding: 0; background: transparent; }
  .file-card {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 14px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    text-decoration: none; color: var(--text); transition: border-color .15s, background .15s;
    max-width: 300px;
  }
  .file-card:hover { border-color: var(--accent); background: var(--panel); }
  .file-icon {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .file-info { min-width: 0; }
  .file-name { font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* 系统 / 错误提示 */
  .sys-line { text-align: center; font-size: 12px; color: var(--muted-2); padding: 5px 0; }
  .sys-line .time { font-size: 10.5px; opacity: .7; margin-right: 6px; }
  .err-line { text-align: center; font-size: 12.5px; color: var(--err); padding: 6px 0; }

  #empty-tip { text-align: center; color: var(--muted-2); font-size: 13px; padding: 40px 0; }

  /* 输入区 */
  #composer-wrap { padding: 12px 20px 18px; }
  #composer {
    display: flex; align-items: flex-end; gap: 9px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px 10px;
    transition: border-color .18s, box-shadow .18s;
  }
  #composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #input {
    flex: 1; padding: 7px 6px; border: none; background: transparent; color: var(--text);
    font-size: 14px; outline: none; resize: none; font-family: inherit; line-height: 1.5;
    max-height: 120px;
  }
  #input::placeholder { color: var(--muted-2); }
  #file-btn {
    padding: 8px 10px; border: none; border-radius: 9px; background: transparent;
    color: var(--muted); font-size: 17px; cursor: pointer; transition: color .15s, background .15s;
    line-height: 1;
  }
  #file-btn:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
  #file-btn:disabled { opacity: .4; cursor: not-allowed; }
  #send {
    padding: 9px 18px; border: none; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7b6bff);
    color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: filter .15s; flex-shrink: 0;
  }
  #send:hover:not(:disabled) { filter: brightness(1.1); }
  #send:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  @media (max-width: 720px) {
    #sidebar { width: 76px; }
    #sidebar-head .brand-name, #conn-status, .section-label,
    .conv-meta, #user-list li span:not(.user-avatar) { display: none; }
    #conv-list li, #user-list li { justify-content: center; padding: 9px 0; }
    #chat-head { padding: 12px 14px; }
    #log { padding: 14px; }
    #composer-wrap { padding: 8px 12px 12px; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>

<!-- ============ 登录 / 注册 ============ -->
<div id="auth-screen">
  <div id="auth-card">
    <div class="brand">
      <div class="brand-logo">💬</div>
      <div class="brand-name">communicate</div>
    </div>
    <p class="auth-sub">实时聊天室</p>

    <div class="tabs">
      <button id="tab-login" type="button" class="active">登录</button>
      <button id="tab-register" type="button">注册</button>
    </div>

    <form id="auth-form">
      <div class="field">
        <label for="auth-name">昵称</label>
        <input id="auth-name" autocomplete="username" maxlength="32" placeholder="你的昵称">
      </div>
      <div class="field">
        <label for="auth-pass">密码</label>
        <input id="auth-pass" type="password" autocomplete="current-password" placeholder="密码">
      </div>
      <div class="field hidden" id="confirm-field">
        <label for="auth-pass2">确认密码</label>
        <input id="auth-pass2" type="password" autocomplete="new-password" placeholder="再输一次密码">
      </div>
      <button id="auth-submit" type="submit" class="btn-primary">登录</button>
      <div id="auth-msg"></div>
    </form>

    <p class="auth-hint" id="auth-hint">昵称不存在时会自动为你注册</p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div id="sidebar-head">
      <div class="brand-logo">💬</div>
      <div class="brand-name">communicate</div>
      <span id="conn-status">连接中…</span>
    </div>

    <div id="conv-section">
      <div class="section-label">会话</div>
      <ul id="conv-list"></ul>
    </div>

    <div id="online-section">
      <div class="section-label">在线 <span id="online-count">0</span></div>
      <ul id="user-list"></ul>
    </div>
  </aside>

  <section id="chat">
    <div id="chat-head">
      <div>
        <span id="chat-title">公聊</span>
        <span id="chat-sub"></span>
      </div>
      <div id="chat-head-right">
        <button id="rename-btn" type="button" class="icon-btn">改名</button>
        <span id="rename-box" class="hidden">
          <input id="rename-input" maxlength="32" placeholder="新昵称">
          <button id="rename-ok" type="button" class="icon-btn">确定</button>
          <button id="rename-cancel" type="button" class="icon-btn">取消</button>
        </span>
      </div>
    </div>

    <div id="log"></div>

    <div id="composer-wrap">
      <form id="composer">
        <textarea id="input" rows="1" autocomplete="off" placeholder="说点什么…" disabled></textarea>
        <button id="file-btn" type="button" disabled title="发送文件">📎</button>
        <button id="send" type="submit" disabled>发送</button>
        <input id="file-input" type="file" hidden>
      </form>
    </div>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // ---- DOM 引用 ----
  const authScreen = $('auth-screen');
  const authForm = $('auth-form');
  const authName = $('auth-name');
  const authPass = $('auth-pass');
  const authPass2 = $('auth-pass2');
  const authMsg = $('auth-msg');
  const authHint = $('auth-hint');
  const authSubmit = $('auth-submit');
  const confirmField = $('confirm-field');
  const tabLogin = $('tab-login');
  const tabRegister = $('tab-register');

  const app = $('app');
  const log = $('log');
  const input = $('input');
  const sendBtn = $('send');
  const composer = $('composer');
  const convList = $('conv-list');
  const userList = $('user-list');
  const onlineCount = $('online-count');
  const statusEl = $('conn-status');
  const chatTitle = $('chat-title');
  const chatSub = $('chat-sub');
  const renameBtn = $('rename-btn');
  const renameBox = $('rename-box');
  const renameInput = $('rename-input');
  const renameOk = $('rename-ok');
  const renameCancel = $('rename-cancel');
  const fileBtn = $('file-btn');
  const fileInput = $('file-input');

  // ---- 状态 ----
  let ws = null;
  let myName = localStorage.getItem('communicate_name') || '';
  let authMode = 'login';           // 'login' | 'register'
  let pendingAuth = null;           // 'token' | 'password'
  let heartbeat = null;
  let whoTimer = null;
  let renameOld = null;             // 非 null = 改名乐观更新中（值为旧名）

  // 会话隔离：key 为 'public' 或对方昵称，value 为该会话的消息数组。
  // 这是「私聊只显示两人消息」的实现基础——每个会话独立存储、独立渲染。
  const convs = new Map();
  let activeConv = 'public';
  let onlineUsers = [];

  // 头像配色：按昵称哈希取固定色，保证同一个人颜色始终一致。
  const AVATAR_COLORS = [
    'linear-gradient(135deg,#5b8cff,#7b6bff)',
    'linear-gradient(135deg,#ff7b8a,#ff5b9d)',
    'linear-gradient(135deg,#3ddc84,#2bb3a3)',
    'linear-gradient(135deg,#f5c451,#f09a3e)',
    'linear-gradient(135deg,#a78bfa,#7c5bff)',
    'linear-gradient(135deg,#38bdf8,#0ea5e9)',
  ];
  function avatarBg(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initial(name) {
    return name ? name.slice(0, 1).toUpperCase() : '?';
  }
  function makeAvatar(name, cls) {
    const el = document.createElement('div');
    el.className = cls;
    el.style.background = avatarBg(name);
    el.textContent = initial(name);
    return el;
  }

  // ---- 会话管理 ----
  function ensureConv(key) {
    if (!convs.has(key)) convs.set(key, []);
    return convs.get(key);
  }
  // 消息归属哪个会话：公聊/系统 → 'public'；私聊 → 对方昵称。
  function convKeyOf(msg) {
    if (msg.kind !== 'private') return 'public';
    return msg.from === myName ? msg.to : msg.from;
  }
  function pushMsg(msg) {
    const key = convKeyOf(msg);
    ensureConv(key).push(msg);
    if (key === activeConv) appendMsgDom(msg);
    renderConvList();
  }

  // ---- 渲染：会话列表 ----
  function renderConvList() {
    convList.textContent = '';

    // 公聊永远在列表顶部
    convList.appendChild(convItem('public', '公聊', '所有人', null));

    // 私聊会话：与我聊过的人（按最近消息时间倒序）
    const peers = [...convs.keys()].filter((k) => k !== 'public');
    peers.sort((a, b) => {
      const la = convs.get(a), lb = convs.get(b);
      const ta = la.length ? la[la.length - 1].ts || 0 : 0;
      const tb = lb.length ? lb[lb.length - 1].ts || 0 : 0;
      return tb - ta;
    });
    for (const peer of peers) {
      const msgs = convs.get(peer);
      const last = msgs.length ? msgs[msgs.length - 1] : null;
      const preview = last ? (last.file ? '📄 ' + last.file.name : last.text) : '还没有消息';
      const online = onlineUsers.includes(peer);
      convList.appendChild(convItem(peer, peer, preview, online ? '在线' : '离线'));
    }
  }
  function convItem(key, title, sub, badge) {
    const li = document.createElement('li');
    if (key === activeConv) li.className = 'active';

    let av;
    if (key === 'public') {
      av = document.createElement('div');
      av.className = 'conv-avatar public';
      av.textContent = '#';
    } else {
      av = makeAvatar(key, 'conv-avatar');
    }
    li.appendChild(av);

    const meta = document.createElement('div');
    meta.className = 'conv-meta';
    const n = document.createElement('div');
    n.className = 'conv-name';
    n.textContent = title;
    const s = document.createElement('div');
    s.className = 'conv-sub';
    s.textContent = sub || '';
    meta.appendChild(n);
    meta.appendChild(s);
    li.appendChild(meta);

    if (badge) {
      const b = document.createElement('span');
      b.className = 'conv-badge';
      b.textContent = '私聊';
      li.appendChild(b);
    }

    li.addEventListener('click', () => switchConv(key));
    return li;
  }

  function switchConv(key) {
    if (activeConv === key) return;
    activeConv = key;
    ensureConv(key);
    updateChatHead();
    renderConv();
    renderConvList();
    input.focus();
  }

  function updateChatHead() {
    if (activeConv === 'public') {
      chatTitle.textContent = '公聊';
      chatSub.textContent = '所有人可见';
      input.placeholder = '说点什么…';
    } else {
      chatTitle.textContent = activeConv;
      const online = onlineUsers.includes(activeConv);
      chatSub.textContent = online ? '在线 · 仅你俩可见' : '离线 · 仅你俩可见';
      input.placeholder = '发消息给 ' + activeConv + '…';
    }
  }

  // ---- 渲染：消息区 ----
  function renderConv() {
    log.textContent = '';
    const msgs = convs.get(activeConv) || [];
    if (msgs.length === 0) {
      const tip = document.createElement('div');
      tip.id = 'empty-tip';
      tip.textContent = activeConv === 'public' ? '还没有人说话，来打个招呼吧' : '还没有和 ' + activeConv + ' 聊过，发条消息开始吧';
      log.appendChild(tip);
      return;
    }
    for (const m of msgs) appendMsgDom(m);
    log.scrollTop = log.scrollHeight;
  }

  function appendMsgDom(m) {
    const tip = log.querySelector('#empty-tip');
    if (tip) tip.remove();

    if (m.kind === 'system') {
      const d = document.createElement('div');
      d.className = 'sys-line';
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = fmtTime(m.ts);
      d.appendChild(t);
      d.appendChild(document.createTextNode(m.text)); // textContent 语义，防 XSS
      log.appendChild(d);
    } else if (m.kind === 'error') {
      const d = document.createElement('div');
      d.className = 'err-line';
      d.textContent = m.text;
      log.appendChild(d);
    } else {
      log.appendChild(buildMsgNode(m));
    }
    log.scrollTop = log.scrollHeight;
  }

  function buildMsgNode(m) {
    const self = m.from === myName;
    const row = document.createElement('div');
    row.className = 'msg' + (self ? ' self' : '') + (m.file ? ' file' : '');

    // 私聊时对方头像才有意义；公聊里自己的消息不重复显示头像
    row.appendChild(makeAvatar(m.from, 'msg-avatar'));

    const body = document.createElement('div');
    body.className = 'msg-body';

    const head = document.createElement('div');
    head.className = 'msg-head';
    const name = document.createElement('span');
    name.className = 'msg-name';
    name.textContent = self ? '我' : m.from;
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = fmtTime(m.ts);
    head.appendChild(name);
    head.appendChild(time);
    body.appendChild(head);

    if (m.file) {
      // 文件卡片：用 DOM API 赋值 href/textContent，不走 innerHTML（防 XSS）
      const a = document.createElement('a');
      a.className = 'file-card';
      a.href = '/download/' + m.file.id;
      a.download = m.file.name;

      const icon = document.createElement('div');
      icon.className = 'file-icon';
      icon.textContent = '📄';
      a.appendChild(icon);

      const info = document.createElement('div');
      info.className = 'file-info';
      const fn = document.createElement('div');
      fn.className = 'file-name';
      fn.textContent = m.file.name;
      const fs = document.createElement('div');
      fs.className = 'file-size';
      fs.textContent = fmtSize(m.file.size) + ' · 点击下载';
      info.appendChild(fn);
      info.appendChild(fs);
      a.appendChild(info);
      body.appendChild(a);
    } else {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.text; // textContent：用户内容绝不进 innerHTML
      body.appendChild(bubble);
    }

    row.appendChild(body);
    return row;
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function fmtTime(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // ---- 在线列表 ----
  function renderUsers(users) {
    onlineUsers = users || [];
    onlineCount.textContent = onlineUsers.length;
    userList.textContent = '';

    const sorted = onlineUsers.slice().sort((a, b) => a.localeCompare(b));
    for (const u of sorted) {
      const li = document.createElement('li');
      li.appendChild(makeAvatar(u, 'user-avatar'));

      const nm = document.createElement('span');
      nm.textContent = u;
      li.appendChild(nm);

      if (u === myName) {
        li.className = 'me';
        const tag = document.createElement('span');
        tag.className = 'me-tag';
        tag.textContent = '我';
        li.appendChild(tag);
      } else {
        li.title = '与 ' + u + ' 私聊';
        li.addEventListener('click', () => openPrivate(u));
      }
      userList.appendChild(li);
    }
    updateChatHead();
    renderConvList();
  }

  // 点在线用户：切到与他的私聊会话（会话不存在则新建空的）
  function openPrivate(u) {
    ensureConv(u);
    switchConv(u);
  }

  // ---- 连接 ----
  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws');

    ws.onopen = () => {
      setStatus('已连接', 'ok');
      startHeartbeat();
      const token = localStorage.getItem('communicate_token');
      if (token) {
        pendingAuth = 'token';
        ws.send(JSON.stringify({ type: 'auth_token', token: token }));
      } else {
        pendingAuth = 'password';
        showAuth();
      }
    };

    ws.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      handle(m);
    };

    ws.onclose = () => {
      setStatus('已断开', 'err');
      stopHeartbeat();
      stopWhoTimer();
      enableComposer(false);
      showAuth('连接已断开，请重新登录');
      setTimeout(connect, 2000);
    };

    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  function handle(m) {
    switch (m.type) {
      case 'system':
        if (renameOld !== null && m.content.startsWith('已更新昵称为')) {
          renameOld = null;
          if (m.token) localStorage.setItem('communicate_token', m.token);
        } else if (m.token) {
          // 鉴权成功：token 落盘，进入主界面
          localStorage.setItem('communicate_token', m.token);
          localStorage.setItem('communicate_name', myName);
          pendingAuth = null;
          enterApp();
          requestWho();
          requestHistory();
          startWhoTimer();
        }
        pushMsg({ kind: 'system', text: m.content, ts: m.ts });
        break;

      case 'broadcast':
        pushMsg({ kind: 'chat', text: m.content, from: m.from, ts: m.ts });
        break;

      case 'private':
        pushMsg({ kind: 'private', text: m.content, from: m.from, to: m.to, ts: m.ts });
        break;

      case 'file': {
        const msg = {
          kind: m.to ? 'private' : 'chat',
          from: m.from, to: m.to, ts: m.ts,
          file: { id: m.file_id, name: m.file_name, size: m.file_size },
        };
        // 私聊文件只进对应会话；公聊文件进公聊
        pushMsg(msg);
        break;
      }

      case 'error':
        if (pendingAuth) {
          if (pendingAuth === 'token') localStorage.removeItem('communicate_token');
          pendingAuth = null;
          authMsg.textContent = m.error;
          showAuth();
        } else if (renameOld !== null) {
          myName = renameOld;
          renameOld = null;
          localStorage.setItem('communicate_name', myName);
          requestWho();
          pushMsg({ kind: 'error', text: m.error, ts: m.ts });
        } else {
          pushMsg({ kind: 'error', text: m.error, ts: m.ts });
        }
        break;

      case 'who_list':
        renderUsers(m.users || []);
        break;

      case 'history':
        renderHistory(m.messages || []);
        break;

      case 'pong':
        break;
    }
  }

  // 历史消息按会话分流：公聊进 'public'，私聊进与对方的会话。
  // 后端已按 viewer 过滤（只返回公聊 + 与我相关的私聊），这里只需归类。
  function renderHistory(messages) {
    for (const msg of messages) {
      let item;
      if (msg.type === 'chat') {
        item = { kind: 'chat', text: msg.content, from: msg.from, ts: msg.ts };
      } else if (msg.type === 'private') {
        item = { kind: 'private', text: msg.content, from: msg.from, to: msg.to, ts: msg.ts };
      } else if (msg.type === 'file') {
        item = {
          kind: msg.to ? 'private' : 'chat',
          from: msg.from, to: msg.to, ts: msg.ts,
          file: { id: msg.file_id, name: msg.file_name, size: msg.file_size },
        };
      } else {
        continue;
      }
      ensureConv(convKeyOf(item)).push(item);
    }
    renderConvList();
    renderConv();
  }

  function requestWho() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'who' }));
  }
  function requestHistory() {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'history', limit: 50 }));
  }
  function startWhoTimer() { stopWhoTimer(); whoTimer = setInterval(requestWho, 30000); }
  function stopWhoTimer() { if (whoTimer) { clearInterval(whoTimer); whoTimer = null; } }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeat = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'heartbeat' }));
    }, 20000);
  }
  function stopHeartbeat() { if (heartbeat) { clearInterval(heartbeat); heartbeat = null; } }

  // ---- 界面切换 ----
  function enterApp() {
    authScreen.classList.add('hidden');
    app.classList.remove('hidden');
    enableComposer(true);
    ensureConv('public');
    updateChatHead();
    renderConv();
    renderConvList();
  }
  function showAuth(msg) {
    authScreen.classList.remove('hidden');
    app.classList.add('hidden');
    if (msg) authMsg.textContent = msg;
    enableComposer(false);
    authName.focus();
  }
  function enableComposer(on) {
    input.disabled = !on;
    sendBtn.disabled = !on;
    fileBtn.disabled = !on;
    renameBtn.classList.toggle('hidden', !on);
    if (!on) renameBox.classList.add('hidden');
    if (on) input.focus();
  }

  // ---- 登录 / 注册 分页 ----
  function setAuthMode(mode) {
    authMode = mode;
    authMsg.textContent = '';
    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      confirmField.classList.add('hidden');
      authSubmit.textContent = '登录';
      authHint.textContent = '昵称不存在时会自动为你注册';
      authPass.setAttribute('autocomplete', 'current-password');
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      confirmField.classList.remove('hidden');
      authSubmit.textContent = '注册并进入';
      authHint.textContent = '若昵称已被注册，将直接用该密码登录';
      authPass.setAttribute('autocomplete', 'new-password');
    }
  }
  tabLogin.onclick = () => setAuthMode('login');
  tabRegister.onclick = () => setAuthMode('register');

  authForm.onsubmit = (e) => {
    e.preventDefault();
    const name = authName.value.trim();
    const pass = authPass.value;
    if (!name || !pass) { authMsg.textContent = '昵称和密码不能为空'; return; }
    if (authMode === 'register') {
      if (pass.length < 6) { authMsg.textContent = '密码至少 6 位'; return; }
      if (pass !== authPass2.value) { authMsg.textContent = '两次输入的密码不一致'; return; }
    }
    if (!ws || ws.readyState !== WebSocket.OPEN) { authMsg.textContent = '未连接到服务器，请稍候'; return; }

    myName = name;
    pendingAuth = 'password';
    authMsg.textContent = '';
    authSubmit.disabled = true;
    ws.send(JSON.stringify({ type: 'auth', name: name, password: pass }));
    authPass.value = '';
    authPass2.value = '';
    setTimeout(() => { authSubmit.disabled = false; }, 1500);
  };

  // ---- 改名 ----
  function showRenameBox() {
    renameBtn.classList.add('hidden');
    renameBox.classList.remove('hidden');
    renameInput.value = '';
    renameInput.focus();
  }
  function hideRenameBox() {
    renameBox.classList.add('hidden');
    renameBtn.classList.remove('hidden');
  }
  renameBtn.onclick = showRenameBox;
  renameCancel.onclick = hideRenameBox;
  renameOk.onclick = () => {
    const n = renameInput.value.trim();
    if (!n) { renameInput.focus(); return; }
    renameOld = myName;
    myName = n;
    localStorage.setItem('communicate_name', myName);
    ws.send(JSON.stringify({ type: 'rename', new_name: n }));
    requestWho();
    hideRenameBox();
    updateChatHead();
  };
  renameInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); renameOk.onclick(); } };

  // ---- 发消息 ----
  composer.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    if (activeConv === 'public') {
      ws.send(JSON.stringify({ type: 'chat', content: text }));
      // 公聊广播会回显给所有人（含自己），无需本地回显
    } else {
      ws.send(JSON.stringify({ type: 'private', to: activeConv, content: text }));
      // 后端私聊只投递给对方、不回显给发送者，本地回显否则发送者以为没发出去
      pushMsg({ kind: 'private', text, from: myName, to: activeConv, ts: Math.floor(Date.now() / 1000) });
    }
    input.value = '';
    autoGrow();
    input.focus();
  };

  // 输入框随内容自动增高（上限由 CSS max-height 控制）
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });

  // ---- 文件上传 ----
  // 两步：POST /upload 存字节拿 file_id → 发 WS 的 file 消息投递元数据。
  // 私聊会话下带 to，服务端只投递给对方，不广播。
  fileBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    if (fileInput.files && fileInput.files[0]) uploadFile(fileInput.files[0]);
  };

  async function uploadFile(file) {
    const token = localStorage.getItem('communicate_token');
    if (!token || !ws || ws.readyState !== WebSocket.OPEN) {
      pushMsg({ kind: 'error', text: '请先登录后再发文件', ts: nowSec() });
      return;
    }
    const targetConv = activeConv; // 上传期间用户可能切会话，锁定当时的会话
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd,
      });
      if (!res.ok) {
        const msg = (await res.text()).trim();
        pushMsg({ kind: 'error', text: '上传失败（' + res.status + '）' + (msg ? '：' + msg : ''), ts: nowSec() });
        return;
      }
      const data = await res.json();
      if (ws.readyState !== WebSocket.OPEN) return;

      const out = { type: 'file', file_id: data.file_id, file_name: data.file_name, file_size: data.file_size };
      if (targetConv !== 'public') {
        out.to = targetConv;
        ws.send(JSON.stringify(out));
        // 私聊不回显给发送者，本地补一条（放进当时的会话）
        const item = {
          kind: 'private', from: myName, to: targetConv, ts: nowSec(),
          file: { id: data.file_id, name: data.file_name, size: data.file_size },
        };
        ensureConv(targetConv).push(item);
        if (activeConv === targetConv) appendMsgDom(item);
        renderConvList();
      } else {
        ws.send(JSON.stringify(out));
      }
    } catch (err) {
      pushMsg({ kind: 'error', text: '上传失败，请重试', ts: nowSec() });
    } finally {
      fileInput.value = '';
    }
  }

  function nowSec() { return Math.floor(Date.now() / 1000); }

  // ---- 启动 ----
  myName = localStorage.getItem('communicate_name') || '';
  setAuthMode('login');
  connect();
</script>
</body>
</html>
