# Prometheus 抓取与告警评估配置。
# 与 alerts.yml / alertmanager.yml 一起挂载进 Prometheus 容器（见 docker-compose.monitoring.yml）。
global:
  scrape_interval: 15s      # 每 15 秒抓一次 gateway 指标
  evaluation_interval: 15s  # 每 15 秒评估一次告警规则

# 告警规则单独放 alerts.yml，便于维护。
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: communicate
    metrics_path: /metrics
    static_configs:
      # 生产上 gateway 的 -metrics 监听 :9100（全网卡，防火墙挡对外）。
      # Prometheus 跑在 Docker 里时用 host.docker.internal 访问宿主机（compose 配了 host-gateway）。
      # 若 Prometheus 直接跑在宿主机（非容器），把下面改成 localhost:9100。
      - targets: [host.docker.internal:9100]
        labels:
          service: communicate
