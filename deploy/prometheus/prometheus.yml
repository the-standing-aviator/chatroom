# Prometheus 抓取与告警评估配置。
# 与 alerts.yml / alertmanager.yml 一起挂载进 Prometheus 容器（见 docker-compose.monitoring.yml）。
global:
  scrape_interval: 15s      # 每 15 秒抓一次 gateway 指标
  evaluation_interval: 15s  # 每 15 秒评估一次告警规则

# 告警规则单独放 alerts.yml，便于维护。
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: communicate
    metrics_path: /metrics
    static_configs:
      # gateway 已容器化，与 Prometheus 同在 compose 网络，直接用服务名直连。
      - targets: [gateway:9100]
        labels:
          service: communicate
