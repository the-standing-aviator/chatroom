# communicate 反向代理：TLS 终止 + WebSocket 升级。
# 安装：sudo cp deploy/nginx.conf /etc/nginx/sites-available/communicate
#       sudo ln -s /etc/nginx/sites-available/communicate /etc/nginx/sites-enabled/
#       sudo certbot --nginx -d chat.example.com   # 自动签发/续期证书
# 把两处 server_name 换成你的真实域名。

server {
    listen 80;
    server_name chat.example.com;
    # HTTP 一律跳 HTTPS（浏览器从 https 页面发 wss:// 连接，必须先有 TLS）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;

    # certbot 会自动填这两行；手动配置则指向你自己的证书
    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    # 前端页面（/）与 WebSocket（/ws）都代理到 gateway 的 -ws-addr 端口
    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;

        # WebSocket 升级必需的两行，缺一不可
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：前端 20s 一次心跳，超时设大点别误断
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
