# 监控栈编排（第一步：Prometheus + Alertmanager，先让告警闭环；Grafana 大盘下一步再加）。
# 与根目录 docker-compose.yml（PG/NATS/Redis 开发依赖）分开：监控栈通常跟业务服务一起长跑。
#
# 用法（在 deploy/ 目录下）：
#   docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus  UI: http://localhost:9090
#   Alertmanager UI: http://localhost:9093
#
# 前置：gateway 已在宿主机跑起来，且 -metrics 监听 127.0.0.1:9090（见 deploy/gateway.service）。
#       Prometheus 容器通过 host.docker.internal 访问宿主机回环上的 gateway 指标端口。

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: communicate-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'   # 本地只留 15 天，长存交给后续远程存储
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # 让容器能访问宿主机回环上的 gateway 指标（127.0.0.1:9090）。
      # host-gateway 是 Docker 20.10+ 的魔法值，自动解析到宿主机 IP。
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: communicate-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
